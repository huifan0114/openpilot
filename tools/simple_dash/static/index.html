<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FrogPilot Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/static/manifest.json">
</head>
<body>
  <div id="dashboard">

    <!-- 左上角: MAX 速度 + 速限 -->
    <div id="top-left-controls">
      <div id="max-speed-card" class="card">
        <div class="label-small">MAX</div>
        <div id="max-speed-value" class="value-large">--</div>
        <div id="max-speed-unit" class="label-tiny">km/h</div>
      </div>

      <div id="speed-limit-card" class="card">
        <!-- MUTCD (美式方形) -->
        <div id="mutcd-sign" class="speed-sign">
          <div class="sign-border">
            <div class="sign-label">SPEED</div>
            <div class="sign-label">LIMIT</div>
            <div id="mutcd-value" class="sign-value">--</div>
          </div>
        </div>
      </div>

      <!-- 即將到來的速限 -->
      <div id="upcoming-limit-card" class="card">
        <div class="label-small">即將到來</div>
        <div id="upcoming-value" class="value-medium">--</div>
        <div id="upcoming-distance" class="label-tiny">-- 米</div>
      </div>
    </div>

    <!-- 右上角: CEM + 指南針 -->
    <div id="top-right-status">
      <div id="cem-card" class="card icon-card hidden">
        <div id="cem-icon" class="cem-icon"></div>
      </div>

      <div id="compass-card" class="card hidden">
        <canvas id="compass-canvas" width="120" height="120"></canvas>
      </div>
    </div>

    <!-- 中央: 前車資訊卡片 (主要顯示) -->
    <div id="center-lead-info">
      <div id="lead-card" class="card lead-info-card">

        <!-- 無前車狀態 -->
        <div id="no-lead-state">
          <div class="no-lead-icon">🚗</div>
          <div class="no-lead-text">無前車</div>
        </div>

        <!-- 有前車狀態 -->
        <div id="has-lead-state" class="hidden">
          <!-- 距離區塊 -->
          <div class="info-section">
            <div class="info-label">前車距離</div>
            <div id="lead-distance" class="info-value-large">-- 米</div>
            <div id="desired-distance" class="info-sublabel">(期望: -- 米)</div>
          </div>

          <!-- 分隔線 -->
          <div class="divider"></div>

          <!-- 速度 + 時間區塊 -->
          <div class="info-section">
            <div class="info-row">
              <div class="info-col">
                <div class="info-label">前車速度</div>
                <div id="lead-speed" class="info-value-large">-- km/h</div>
              </div>
              <div class="info-col">
                <div class="info-label">跟車時間</div>
                <div id="follow-time" class="info-value-large">-- 秒</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 左下角: 當前速度 + CSC -->
    <div id="bottom-left-info">
      <div id="current-speed-card" class="card small-card">
        <div id="current-speed-value" class="value-medium">--</div>
        <div id="current-speed-unit" class="label-small">km/h</div>
      </div>

      <div id="csc-card" class="card">
        <div class="csc-icon-container">
          <div id="csc-icon" class="csc-curve-icon">↪️</div>
        </div>
        <div id="csc-speed" class="value-medium">--</div>
        <div id="csc-speed-unit" class="label-tiny">km/h</div>
        <div id="csc-training" class="training-label hidden">Training...</div>
      </div>
    </div>

    <!-- 右下角: 加減速度 -->
    <div id="bottom-right-acceleration">
      <div id="acceleration-card" class="card small-card">
        <div class="label-small">加減速度</div>
        <div id="acceleration-value" class="value-medium neutral">--</div>
        <div class="label-tiny">m/s²</div>
      </div>
    </div>

    <!-- 底部中央: 道路名稱 -->
    <div id="bottom-center-road">
      <div id="road-name-card" class="card hidden">
        <div id="road-name-text">--</div>
      </div>

      <div id="standstill-timer-card" class="card hidden">
        <div id="standstill-minutes" class="timer-value">--</div>
        <div id="standstill-seconds" class="timer-sublabel">--</div>
      </div>
    </div>

    <!-- 狀態指示器 (右上角小點) -->
    <div id="status-indicator">
      <div class="status-dot"></div>
      <span id="status-text">連接中...</span>
    </div>

  </div>

  <!-- Wake Lock 防止休眠 -->
  <script>
    if ('wakeLock' in navigator) {
      let wakeLock = null;
      const requestWakeLock = async () => {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Wake Lock activated');
        } catch (err) {
          console.error('Wake Lock error:', err);
        }
      };
      requestWakeLock();

      // 重新取得 (切換 app 時會失效)
      document.addEventListener('visibilitychange', () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });
    }

    // 隱藏地址欄
    window.addEventListener('load', () => {
      setTimeout(() => window.scrollTo(0, 1), 100);
    });
  </script>

  <!-- 載入模組 -->
  <script src="/static/js/webrtc.js" type="module"></script>
  <script src="/static/js/dashboard.js" type="module"></script>
  <script src="/static/js/main.js" type="module"></script>
</body>
</html>
