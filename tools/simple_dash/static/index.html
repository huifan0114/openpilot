<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FrogPilot Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <div id="dashboard">

    <!-- 頂部中央: 連接狀態 -->
    <div id="top-center-status" class="hidden">
      <div id="connection-status" class="connection-badge connecting">
        <span id="status-text">連接中...</span>
      </div>
    </div>

    <!-- 中央上方: MAX + 彎道 + VSC + 漸進 (並排，最低值會有動畫標示) -->
    <div id="center-top-speeds">
      <div id="max-speed-card" class="card">
        <div class="label-small">MAX</div>
        <div id="max-speed-value" class="value-large">--</div>
      </div>

      <div id="csc-card" class="card">
        <div class="label-small">彎道</div>
        <div id="csc-speed" class="value-large">--</div>
      </div>

      <div id="vsc-card" class="card">
        <div class="label-small">VSC</div>
        <div id="vsc-speed" class="value-large">--</div>
      </div>

      <div id="progressive-card" class="card">
        <div class="label-small">漸進</div>
        <div id="progressive-speed" class="value-large">--</div>
      </div>
    </div>

    <!-- 左側控制區: 速限 + 即將到來 (平均分配) -->
    <div id="top-left-controls">
      <div id="speed-limit-card" class="card">
        <div class="label-small">速限</div>
        <div id="speed-limit-value" class="value-medium">--</div>
      </div>

      <!-- 即將到來的速限 -->
      <div id="upcoming-limit-card" class="card">
        <div class="label-small">即將到來</div>
        <div id="upcoming-value" class="value-medium">--</div>
        <div id="upcoming-distance" class="label-tiny">--</div>
      </div>
    </div>

    <!-- 右側控制區: 控制加速 + EXPERIMENTAL MODE (與前車卡片底部齊平) -->
    <div id="top-right-controls">
      <!-- 控制加速 (actuatorsOutput.accel) -->
      <div id="control-accel-card" class="card">
        <div class="label-small">控制加速</div>
        <div id="control-accel-value" class="value-medium neutral">--</div>
      </div>

      <!-- EXPERIMENTAL MODE 圖示 -->
      <div id="experimental-card" class="card experimental-icon-card">
        <img id="experimental-icon" src="/static/assets/img_experimental_white.svg" alt="Experimental Mode" />
      </div>
    </div>

    <!-- 中央: 前車資訊卡片 (主要顯示) -->
    <div id="center-lead-info">
      <!-- 左側盲點警示 -->
      <div id="left-blindspot" class="blindspot-indicator hidden">
        <div class="blindspot-icon">⚠️</div>
        <div class="blindspot-label">左側</div>
      </div>

      <div id="lead-card" class="card lead-info-card">

        <!-- 無前車狀態 -->
        <div id="no-lead-state">
          <div class="no-lead-icon">🚗</div>
          <div class="no-lead-text">無前車</div>
        </div>

        <!-- 有前車狀態 -->
        <div id="has-lead-state" class="hidden">
          <!-- 4個資訊水平排列，手機時自動換行 -->
          <div class="info-row-flex">
            <div class="info-col">
              <div class="info-label">距離</div>
              <div id="lead-distance" class="info-value-medium">--</div>
            </div>
            <div class="info-col">
              <div class="info-label">期望</div>
              <div id="desired-distance" class="info-value-medium">--</div>
            </div>
            <div class="info-col">
              <div class="info-label">速度</div>
              <div id="lead-speed" class="info-value-medium">--</div>
            </div>
            <div class="info-col">
              <div class="info-label">時間</div>
              <div id="follow-time" class="info-value-medium">--</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側盲點警示 -->
      <div id="right-blindspot" class="blindspot-indicator hidden">
        <div class="blindspot-icon">⚠️</div>
        <div class="blindspot-label">右側</div>
      </div>
    </div>

    <!-- 前車下方: 導航資訊列 (全寬，與左右側卡片齊平) -->
    <div id="nav-row">
      <!-- 導航指示卡片 (來自 NavBridge) -->
      <div id="nav-instruction-card" class="card nav-card hidden">
        <div class="nav-content">
          <div id="nav-icon" class="nav-icon">→</div>
          <div class="nav-info">
            <div class="nav-main-row">
              <span id="nav-distance" class="nav-distance">--</span>
              <span id="nav-instruction" class="nav-instruction">--</span>
            </div>
            <!-- 導航中的道路名稱 -->
            <div id="nav-road-name" class="nav-road-name"></div>
            <!-- 行程資訊 (剩餘距離/時間/ETA) -->
            <div class="nav-trip-row">
              <span id="nav-remaining" class="nav-remaining"></span>
              <span id="nav-eta" class="nav-eta"></span>
            </div>
          </div>
        </div>
      </div>
      <!-- 道路名稱卡片 (固定顯示) -->
      <div id="road-name-card" class="card">
        <div id="road-name-text">--</div>
      </div>
    </div>

    <!-- 底部全寬導航動畫條 -->
    <div id="bottom-navigation-bar">
      <img id="nav-standby-gif" src="/static/assets/navstandby2.gif" alt="Navigation" />
    </div>

  </div>

  <!-- Wake Lock 防止休眠 -->
  <script>
    if ('wakeLock' in navigator) {
      let wakeLock = null;
      const requestWakeLock = async () => {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Wake Lock activated');
        } catch (err) {
          console.error('Wake Lock error:', err);
        }
      };
      requestWakeLock();

      // 重新取得 (切換 app 時會失效)
      document.addEventListener('visibilitychange', () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });
    }

    // 隱藏地址欄
    window.addEventListener('load', () => {
      setTimeout(() => window.scrollTo(0, 1), 100);
    });
  </script>

  <!-- 載入模組 -->
  <script src="/static/js/webrtc.js" type="module"></script>
  <script src="/static/js/dashboard.js" type="module"></script>
  <script src="/static/js/navigation.js" type="module"></script>
  <script src="/static/js/main.js" type="module"></script>
</body>
</html>
