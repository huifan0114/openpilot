<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FrogPilot Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <div id="dashboard">

    <!-- 頂部中央: 連接狀態 -->
    <div id="top-center-status" class="hidden">
      <div id="connection-status" class="connection-badge connecting">
        <span id="status-text">連接中...</span>
      </div>
    </div>

    <!-- 中央上方: MAX + VC + 彎道 (並排) -->
    <div id="center-top-speeds">
      <div id="max-speed-card" class="card">
        <div class="label-small">MAX</div>
        <div id="max-speed-value" class="value-large">--</div>
      </div>

      <div id="vcruise-card" class="card">
        <div class="label-small">VC</div>
        <div id="vcruise-value" class="value-large">--</div>
      </div>

      <div id="csc-card" class="card">
        <div class="label-small">彎道</div>
        <div id="csc-speed" class="value-large">--</div>
      </div>
    </div>

    <!-- 左上角: 速限 + 即將到來速限 -->
    <div id="top-left-controls">
      <div id="speed-limit-card" class="card">
        <div class="label-small">速限</div>
        <div id="speed-limit-value" class="value-medium">--</div>
      </div>

      <!-- 即將到來的速限 (與速限標誌放在一起) -->
      <div id="upcoming-limit-card" class="card">
        <div class="label-small">即將到來</div>
        <div id="upcoming-value" class="value-medium">--</div>
        <div id="upcoming-distance" class="label-tiny">--</div>
      </div>
    </div>

    <!-- 右上角: CEM 狀態 -->
    <!-- ⚠️ 暫時註解，改為視覺監控面板
    <div id="top-right-cem">
      <div id="cem-card" class="card small-card hidden">
        <div id="cem-status-row">
          <span id="cem-icon" class="cem-icon">🤖</span>
          <span id="cem-text" class="cem-text">實驗</span>
        </div>
      </div>
    </div>
    -->

    <!-- 右下角: EXPERIMENTAL MODE -->
    <!-- ⚠️ 暫時註解，改為視覺監控面板
    <div id="bottom-right-experimental">
      <!-- EXPERIMENTAL MODE 圖示 -->
      <div id="experimental-card" class="card experimental-icon-card">
        <img id="experimental-icon" src="/static/assets/img_experimental_white.svg" alt="Experimental Mode" />
      </div>
    </div>
    -->

    <!-- 右側: 視覺不確定性監控面板 -->
    <div id="right-vision-monitor">
      <div id="vision-monitor-card" class="card vision-card">

        <!-- 標題 -->
        <div class="vision-header">視覺監控</div>

        <!-- 不確定性指標區 -->
        <div class="vision-section">
          <div class="vision-section-title">不確定性</div>

          <div class="vision-row">
            <span class="vision-label">xStd:</span>
            <span id="vision-xstd" class="vision-value">--</span>
            <span class="vision-unit">m</span>
            <span id="vision-xstd-warn" class="vision-warn hidden">⚠</span>
          </div>

          <div class="vision-row">
            <span class="vision-label">vStd:</span>
            <span id="vision-vstd" class="vision-value">--</span>
            <span class="vision-unit">m/s</span>
            <span id="vision-vstd-warn" class="vision-warn hidden">⚠</span>
          </div>

          <div class="vision-row">
            <span class="vision-label">Prob:</span>
            <span id="vision-prob" class="vision-value">--</span>
            <span class="vision-unit"></span>
            <span id="vision-prob-warn" class="vision-warn hidden">⚠</span>
          </div>
        </div>

        <!-- 安全指標區 -->
        <div class="vision-section">
          <div class="vision-section-title">安全指標</div>

          <div class="vision-row">
            <span class="vision-label">TTC:</span>
            <span id="vision-ttc" class="vision-value ttc-value">--</span>
            <span class="vision-unit">秒</span>
          </div>

          <div class="vision-row">
            <span class="vision-label">距離:</span>
            <span id="vision-drel" class="vision-value">--</span>
            <span class="vision-unit">m</span>
          </div>

          <div class="vision-row">
            <span class="vision-label">速差:</span>
            <span id="vision-vrel" class="vision-value">--</span>
            <span class="vision-unit">km/h</span>
          </div>
        </div>

        <!-- 定速模擬區 -->
        <div class="vision-section">
          <div class="vision-section-header">
            <div class="vision-section-title">定速模擬</div>
            <span id="vcruise-sim-status" class="sim-status-badge normal">正常</span>
          </div>

          <div class="vision-row">
            <span class="vision-label">原始:</span>
            <span id="vcruise-original" class="vision-value">--</span>
            <span class="vision-unit">km/h</span>
          </div>

          <div class="vision-row">
            <span class="vision-label">建議:</span>
            <span id="vcruise-suggested" class="vision-value sim-suggested">--</span>
            <span class="vision-unit">km/h</span>
          </div>

          <div class="vision-row">
            <span class="vision-label">降低:</span>
            <span id="vcruise-reduction" class="vision-value sim-reduction">--</span>
            <span class="vision-unit">km/h</span>
          </div>

          <div class="vision-row">
            <span class="vision-label">觸發:</span>
            <div id="trigger-tags" class="trigger-tags">
              <span id="tag-xstd" class="trigger-tag hidden">xStd</span>
              <span id="tag-vstd" class="trigger-tag hidden">vStd</span>
              <span id="tag-prob" class="trigger-tag hidden">Prob</span>
              <span id="tag-ttc" class="trigger-tag hidden">TTC</span>
              <span id="tag-accel" class="trigger-tag hidden">加速</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 中央: 前車資訊卡片 (主要顯示) -->
    <div id="center-lead-info">
      <!-- 左側盲點警示 -->
      <div id="left-blindspot" class="blindspot-indicator hidden">
        <div class="blindspot-icon">⚠️</div>
        <div class="blindspot-label">左側</div>
      </div>

      <div id="lead-card" class="card lead-info-card">

        <!-- 無前車狀態 -->
        <div id="no-lead-state">
          <div class="no-lead-icon">🚗</div>
          <div class="no-lead-text">無前車</div>
        </div>

        <!-- 有前車狀態 -->
        <div id="has-lead-state" class="hidden">
          <!-- 4個資訊水平排列，手機時自動換行 -->
          <div class="info-row-flex">
            <div class="info-col">
              <div class="info-label">距離</div>
              <div id="lead-distance" class="info-value-medium">--</div>
            </div>
            <div class="info-col">
              <div class="info-label">期望</div>
              <div id="desired-distance" class="info-value-medium">--</div>
            </div>
            <div class="info-col">
              <div class="info-label">速度</div>
              <div id="lead-speed" class="info-value-medium">--</div>
            </div>
            <div class="info-col">
              <div class="info-label">時間</div>
              <div id="follow-time" class="info-value-medium">--</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側盲點警示 -->
      <div id="right-blindspot" class="blindspot-indicator hidden">
        <div class="blindspot-icon">⚠️</div>
        <div class="blindspot-label">右側</div>
      </div>
    </div>

    <!-- 左下角: 加減速度 -->
    <div id="bottom-left-acceleration">
      <div id="acceleration-card" class="card small-card">
        <div class="label-small">加減速度</div>
        <div id="acceleration-value" class="value-medium neutral">--</div>
      </div>
    </div>

    <!-- 底部中央: 道路名稱 -->
    <div id="bottom-center-road">
      <div id="road-name-card" class="card hidden">
        <div id="road-name-text">--</div>
      </div>
    </div>

    <!-- 底部全寬導航動畫條 -->
    <div id="bottom-navigation-bar">
      <img id="nav-standby-gif" src="/static/assets/navstandby2.gif" alt="Navigation" />
    </div>

  </div>

  <!-- Wake Lock 防止休眠 -->
  <script>
    if ('wakeLock' in navigator) {
      let wakeLock = null;
      const requestWakeLock = async () => {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Wake Lock activated');
        } catch (err) {
          console.error('Wake Lock error:', err);
        }
      };
      requestWakeLock();

      // 重新取得 (切換 app 時會失效)
      document.addEventListener('visibilitychange', () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });
    }

    // 隱藏地址欄
    window.addEventListener('load', () => {
      setTimeout(() => window.scrollTo(0, 1), 100);
    });
  </script>

  <!-- 載入模組 -->
  <script src="/static/js/webrtc.js" type="module"></script>
  <script src="/static/js/dashboard.js" type="module"></script>
  <script src="/static/js/main.js" type="module"></script>
</body>
</html>
